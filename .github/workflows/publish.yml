name: Publish site

# This repo is private, and GitHub Pages only serves public repos on a free plan. So the built site (and only the
# built files, no source and no history) is published into the PUBLIC user-site repo, inside a folder:
#   https://keerthi1817.github.io/portofolio/   <-   Keerthi1817/Keerthi1817.github.io  ->  portofolio/
# One-time setup is described in README.md ("Deployment").
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch: {}   # manual re-run from the Actions tab

# Publishing pushes to one shared repo, so queue runs instead of racing.
concurrency:
  group: publish-site
  cancel-in-progress: false

permissions:
  contents: read

env:
  PUBLISH_REPO: Keerthi1817/Keerthi1817.github.io
  PUBLISH_DIR: portofolio   # must match Vite `base` and the router basename

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check the deploy key is configured
        env:
          PAGES_DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: |
          if [ -z "$PAGES_DEPLOY_KEY" ]; then
            echo "::error::The PAGES_DEPLOY_KEY secret is not set. Follow README.md > Deployment (one-time setup), then re-run this workflow."
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check out the public site repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PUBLISH_REPO }}
          ssh-key: ${{ secrets.PAGES_DEPLOY_KEY }}
          path: site

      - name: Copy the build into the site repo
        run: |
          : "${PUBLISH_DIR:?PUBLISH_DIR must be set}"   # never touch the site repo root by accident
          mkdir -p "site/$PUBLISH_DIR"
          find "site/$PUBLISH_DIR" -mindepth 1 -delete   # drop files from older builds (old hashed assets)
          cp -a dist/. "site/$PUBLISH_DIR/"
          touch site/.nojekyll

      - name: Commit and push if anything changed
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed, nothing to publish."
            exit 0
          fi
          git commit -m "Publish ${GITHUB_SHA::7}"
          git push
